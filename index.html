<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1814;--ink2:#3d3a35;--ink3:#6b6760;--ink4:#9c9890;--surface:#faf9f7;--surface2:#f3f1ed;--surface3:#ede9e3;--gold:#b8922a;--gold-light:#e8d5a3;--gold-pale:#fdf6e7;--border:#e2ddd5;--border2:#cec9bf;--sat-bg:#f5f2ff;--sun-bg:#fff6f6;--sat-text:#4a3fa0;--sun-text:#a03030;--lesson-bg:#e8f4ff;--lesson-color:#1a5fa0;--other-bg:#f0ffe8;--other-color:#2a6a2a;--ff-serif:'Cormorant Garamond',serif;--ff-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--r:8px;--r-lg:12px}
html,body{height:100%;font-family:var(--ff-sans)}
.app{background:var(--surface);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.wordmark{padding:0 18px;display:flex;align-items:center;gap:8px;border-right:1px solid var(--border)}
.wordmark-text{font-family:var(--ff-serif);font-size:16px;letter-spacing:.04em;color:var(--ink);font-weight:500}
.wordmark-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.nav-tabs{display:flex;flex:1}
.nav-tab{padding:0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.nav-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.nav-tab:hover:not(.active){color:var(--ink2);background:var(--surface2)}
.store-bar{display:flex;align-items:center;gap:5px;padding:6px 14px;border-left:1px solid var(--border);flex-wrap:wrap}
.store-chip{padding:4px 11px;border-radius:20px;font-size:11px;letter-spacing:.04em;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink3);transition:all .15s;white-space:nowrap}
.store-chip.active{background:var(--ink);color:#faf9f7;border-color:var(--ink)}
.store-chip:hover:not(.active){border-color:var(--gold);color:var(--gold)}
.store-chip.add{border-style:dashed;color:var(--ink4)}
.content{padding:20px;flex:1}
.btn{padding:7px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink2);transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--ink);color:#faf9f7;border-color:var(--ink)}
.btn.gold:hover{background:var(--ink2)}
.btn.ghost-gold{border-color:var(--gold-light);color:var(--gold);background:var(--gold-pale)}
.btn.ghost-gold:hover{background:var(--gold-light)}
.btn.sm{padding:4px 10px;font-size:10px}
.btn.danger{border-color:#e2b8b8;color:#a03030}
.btn.danger:hover{background:#fff6f6}
.divider{height:1px;background:var(--border);margin:16px 0}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.card-title{font-family:var(--ff-serif);font-size:15px;letter-spacing:.02em;color:var(--ink);font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:block}
label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);display:block;margin-bottom:4px}
input,select{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;color:var(--ink);outline:none;font-family:var(--ff-sans)}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,146,42,.12)}
.form-row{margin-bottom:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;text-align:center}
.stat-num{font-family:var(--ff-serif);font-size:28px;color:var(--ink);font-weight:400}
.stat-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);margin-top:4px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0;font-size:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;letter-spacing:.05em}
.badge.ok{background:#f0f8f0;color:#2d6a2d;border:1px solid #c5dfc5}
.badge.warn{background:#fff8ec;color:#8a5a00;border:1px solid #e8d5a3}
.badge.neutral{background:var(--surface2);color:var(--ink3);border:1px solid var(--border)}
.alert{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.alert.warn{background:#fff8ec;color:#7a4f00;border:1px solid #e8d5a3}
.alert.ok{background:#f0f8f0;color:#1e4d1e;border:1px solid #c5dfc5}
.alert.info{background:var(--gold-pale);color:var(--gold);border:1px solid var(--gold-light)}
.staff-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.staff-row:last-child{border-bottom:none}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-head{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);padding:4px}
.cal-head.sat{color:var(--sat-text)}.cal-head.sun{color:var(--sun-text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{border:1px solid var(--border);border-radius:6px;padding:4px 5px;min-height:54px;cursor:pointer;background:#fff;transition:border-color .12s}
.cal-cell:hover{border-color:var(--gold)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.sat-cell{background:var(--sat-bg)}.cal-cell.sun-cell{background:var(--sun-bg)}
.cal-date{font-size:11px;font-weight:500;color:var(--ink);margin-bottom:2px}
.cal-date.sat{color:var(--sat-text)}.cal-date.sun,.cal-date.hol{color:var(--sun-text)}
.off-chip{border-radius:3px;padding:1px 4px;font-size:9px;margin-top:1px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-bar{height:3px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px;background:var(--gold)}.progress-fill.over{background:#c04040}
.hq-store-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;background:#fff}
.hq-store-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--border)}
.hq-store-head:hover{background:var(--surface2)}
.hq-store-body{padding:14px 16px;background:var(--surface)}
.store-accent{width:3px;border-radius:2px;flex-shrink:0}
.cal-table{border-collapse:collapse;width:100%;font-size:11px}
.cal-table th{padding:4px 3px;text-align:center;font-weight:400;color:var(--ink4);border-bottom:1px solid var(--border);white-space:nowrap}
.cal-table td{padding:2px 3px;text-align:center;border:1px solid var(--border);height:26px;vertical-align:middle;background:#fff}
.cal-table td.sat-col{background:var(--sat-bg)}.cal-table td.sun-col{background:var(--sun-bg)}
.cell-off{background:var(--gold-pale);color:var(--gold);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid var(--gold-light)}
.cell-work{color:var(--border2);font-size:10px}
.cell-lesson{background:var(--lesson-bg);color:var(--lesson-color);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid #a8d4f0}
.cell-other{background:var(--other-bg);color:var(--other-color);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid #a8d4a0}
.history-item{padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:6px;cursor:pointer;background:#fff;transition:all .15s}
.history-item:hover{border-color:var(--gold);background:var(--gold-pale)}
.tab-inner{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab-inner-btn{padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-inner-btn.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.tab-inner-btn:hover:not(.active){color:var(--ink2)}
.summary-table{width:100%;border-collapse:collapse;font-size:12px}
.summary-table th{padding:6px 10px;text-align:left;font-weight:400;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);border-bottom:1px solid var(--border);background:var(--surface2)}
.summary-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--ink)}
.summary-table tr:last-child td{border-bottom:none}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--ink2)}
input[type=checkbox],input[type=radio]{width:auto}
.notif-wrap{padding:0 20px}
.notif{display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);font-size:12px;margin-top:10px;background:var(--ink);color:#faf9f7}
.notif.show{display:flex}
.rule-note{font-size:11px;color:var(--ink4);margin-top:6px;padding:8px 10px;background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:var(--r);line-height:1.6}
.req-cal-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.req-cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.req-cal-dow{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0;color:var(--ink4)}
.req-cal-dow.sat{color:var(--sat-text)}.req-cal-dow.sun{color:var(--sun-text)}
.req-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.req-day{border:1px solid var(--border);border-radius:8px;min-height:76px;background:var(--surface);cursor:pointer;transition:border-color .12s;overflow:hidden;display:flex;flex-direction:column}
.req-day:hover{border-color:var(--gold)}
.req-day.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.req-day.sat{background:var(--sat-bg)}.req-day.sun{background:var(--sun-bg)}
.req-day-num{font-size:12px;font-weight:500;padding:5px 7px 2px}
.req-day-num.sat{color:var(--sat-text)}.req-day-num.sun,.req-day-num.hol{color:var(--sun-text)}
.staff-tab-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.staff-tab{padding:8px 14px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s;flex-shrink:0}
.staff-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.staff-tab:hover:not(.active){color:var(--ink2)}
.radio-card{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);cursor:pointer;transition:all .15s;margin-bottom:8px;background:#fff}
.radio-card.selected{border-color:var(--gold);background:var(--gold-pale)}
.radio-card-title{font-size:13px;font-weight:500;color:var(--ink)}
.radio-card-sub{font-size:11px;color:var(--ink4);margin-top:2px}
.req-type-btn{border:1px solid var(--border2);border-radius:4px;padding:3px 6px;font-size:9px;cursor:pointer;transition:all .12s;background:transparent;display:block;width:100%;text-align:center;margin-top:2px;white-space:nowrap}
.req-type-btn.off{border-color:#c8a84a;color:var(--gold);background:var(--gold-pale)}
.req-type-btn.lesson{border-color:#a8d4f0;color:var(--lesson-color);background:var(--lesson-bg)}
.req-type-btn.other{border-color:#a8d4a0;color:var(--other-color);background:var(--other-bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.color-palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.15)}.color-swatch.selected{border-color:var(--ink);transform:scale(1.1)}
.color-preview{width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);flex-shrink:0}
.sync-bar{padding:6px 20px;font-size:11px;color:var(--ink4);background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#c5dfc5;flex-shrink:0}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:#c04040}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar"></div>
  <div class="sync-bar" id="sync-bar"><div class="sync-dot" id="sync-dot"></div><span id="sync-msg">読み込み中...</span></div>
  <div class="notif-wrap"><div class="notif" id="notif"><i class="ti ti-check"></i><span id="notif-msg"></span></div></div>
  <div class="content" id="content"></div>
</div>
<script>
var GAS_URL='https://script.google.com/macros/s/AKfycby5AbHfQFkEbks774BzVS3TgLaG-Zx3YVgdhLuq6nFLCEpYtYZlKQN3iiVDNAwvO5g/exec';
var SAVE_KEY='salonAtelier';
var LEGACY_KEYS=['salonLux8','salonLux7','salonLux6','salonLux5','salonLux4','salonLux3','salonLux2','salonLux','salonHQ2','salonShift'];
function syncStatus(state,msg){var dot=document.getElementById('sync-dot');var m=document.getElementById('sync-msg');if(!dot||!m)return;dot.className='sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':'');m.textContent=msg;}
function gasLoad(cb){syncStatus('syncing','サーバーから読み込み中...');var cbName='_gl'+Date.now();var sc=document.createElement('script');var done=false;window[cbName]=function(res){done=true;delete window[cbName];if(sc.parentNode)sc.parentNode.removeChild(sc);if(res&&res.success&&res.data){syncStatus('ok','同期済み');cb(null,res.data);}else{syncStatus('ok','ローカルデータを使用');cb(null,null);}};sc.onerror=function(){if(!done){done=true;syncStatus('error','オフライン');cb('e',null);}};setTimeout(function(){if(!done){done=true;syncStatus('error','タイムアウト');cb('t',null);}},10000);sc.src=GAS_URL+'?action=load&callback='+cbName;document.body.appendChild(sc);}
function gasSave(data){syncStatus('syncing','保存中...');var cbName='_gs'+Date.now();var sc=document.createElement('script');window[cbName]=function(res){delete window[cbName];if(sc.parentNode)sc.parentNode.removeChild(sc);syncStatus('ok',res&&res.success?'保存しました':'保存エラー');setTimeout(function(){syncStatus('ok','同期済み');},2000);};sc.onerror=function(){syncStatus('error','保存失敗');};sc.src=GAS_URL+'?action=save&data='+encodeURIComponent(data)+'&callback='+cbName;document.body.appendChild(sc);}
var PALETTE=['#b8922a','#8b6914','#c47a3a','#2d5a8a','#4a6fa5','#1a3a6a','#3d7a5a','#5a8a5a','#2d6a4a','#8a4a2d','#a05030','#6a3020','#6a3d8a','#8a5aaa','#4a2d6a','#2d7a7a','#3a9a9a','#1a5a5a','#8a3d6a','#aa5a8a','#6a2050','#5a6a8a','#7a8aaa','#3a4a6a','#6a6a3a','#8a8a5a','#4a4a2a','#8a3a3a','#aa5a5a','#6a2a2a'];
var REQ_TYPES={off_req:{label:'休み希望',short:'休み希望',color:'var(--gold)',bg:'var(--gold-pale)',border:'#c8a84a'},lesson:{label:'社内レッスン',short:'レッスン',color:'var(--lesson-color)',bg:'var(--lesson-bg)',border:'#a8d4f0'},other_store:{label:'他店舗出勤',short:'他店舗',color:'var(--other-color)',bg:'var(--other-bg)',border:'#a8d4a0'}};
var DEFAULT={mode:'hq',activeStore:'A店',activeStoreTab:'shift',activeReqStaff:null,currentYear:2025,currentMonth:6,stores:[{id:'A店',name:'A店 渋谷',color:'#b8922a'},{id:'B店',name:'B店 新宿',color:'#4a6fa5'},{id:'C店',name:'C店 銀座',color:'#5a8a5a'}],staff:[{id:1,name:'田中 花子',role:'スタイリスト',color:'#8b6914',store:'A店'},{id:2,name:'山田 太郎',role:'スタイリスト',color:'#2d5a8a',store:'A店'},{id:3,name:'佐藤 めぐみ',role:'アシスタント',color:'#3d7a5a',store:'A店'},{id:4,name:'鈴木 健一',role:'スタイリスト',color:'#8a4a2d',store:'B店'},{id:5,name:'高橋 あゆみ',role:'アシスタント',color:'#6a3d8a',store:'B店'},{id:6,name:'伊藤 直樹',role:'スタイリスト',color:'#2d7a7a',store:'C店'},{id:7,name:'渡辺 さくら',role:'アシスタント',color:'#8a3d6a',store:'C店'}],storeRules:{'A店':{satMaxOff:3,sunHolMaxOff:1,minStaff:2,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true},'B店':{satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true},'C店':{satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true}},shifts:{},requests:{},history:[],nextId:100,hqCollapsed:{}};
var S=null;
function loadLocal(){try{var d=localStorage.getItem(SAVE_KEY);if(d)return JSON.parse(d);}catch(e){}for(var i=0;i<LEGACY_KEYS.length;i++){try{var d2=localStorage.getItem(LEGACY_KEYS[i]);if(d2)return JSON.parse(d2);}catch(e){}}return null;}
function initState(data){S=data||JSON.parse(JSON.stringify(DEFAULT));if(!S.storeRules)S.storeRules={};if(!S.hqCollapsed)S.hqCollapsed={};if(S.activeReqStaff===undefined)S.activeReqStaff=null;if(!S.stores)S.stores=DEFAULT.stores;if(!S.staff)S.staff=DEFAULT.staff;if(!S.shifts)S.shifts={};if(!S.requests)S.requests={};if(!S.history)S.history=[];if(!S.nextId)S.nextId=100;S.stores.forEach(function(st){if(!S.storeRules[st.id])S.storeRules[st.id]={satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true};var r=S.storeRules[st.id];if(!r.minOffMode)r.minOffMode='weekly2';if(r.minOffDays===undefined)r.minOffDays=8;if(r.sunHolDefaultWork===undefined)r.sunHolDefaultWork=true;});}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}gasSave(JSON.stringify(S));}
var localData=loadLocal();initState(localData);render();syncStatus('ok',localData?'ローカルデータを読み込みました':'初期データを使用');
gasLoad(function(err,gasData){if(gasData){try{var parsed=JSON.parse(gasData);initState(parsed);try{localStorage.setItem(SAVE_KEY,gasData);}catch(e){}render();syncStatus('ok','同期済み');}catch(e){syncStatus('error','データの解析に失敗しました');}}});
var MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var DAYS=['日','月','火','水','木','金','土'];
var JP_HOL=['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-07-20','2026-08-11','2026-09-21','2026-09-23','2026-10-12','2026-11-03','2026-11-23'];
function isHol(y,m,d){return JP_HOL.indexOf(y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2))>=0;}
function dayType(y,m,d){var dow=new Date(y,m-1,d).getDay();if(isHol(y,m,d))return'hol';if(dow===0)return'sun';if(dow===6)return'sat';return'wd';}
function dim(y,m){return new Date(y,m,0).getDate();}
function fdow(y,m){return new Date(y,m-1,1).getDay();}
function sk(){return S.currentYear+'-'+S.currentMonth;}
function gShifts(){return S.shifts[sk()]||{};}
function sShifts(d){S.shifts[sk()]=d;save();}
function gReqs(){return S.requests[sk()]||{};}
function sReqs(d){S.requests[sk()]=d;save();}
function staffByStore(sid){return S.staff.filter(function(s){return s.store===sid;});}
function ini(n){return n.split(' ').map(function(x){return x[0]||'';}).join('').slice(0,2);}
function storeById(id){return S.stores.filter(function(s){return s.id===id;})[0]||{};}
function isOffReq(v){return v==='off_req';}
function isStylist(s){return s.role==='スタイリスト'||s.role==='店長';}
function calcMinOff(sid,y,m){var r=S.storeRules[sid]||{};if(r.minOffMode==='weekly2'){var w=0;var days=dim(y,m);for(var d=1;d<=days;d++)if(new Date(y,m-1,d).getDay()===1)w++;return w*2;}return parseInt(r.minOffDays)||8;}
function notify(msg){var el=document.getElementById('notif');if(!el)return;document.getElementById('notif-msg').textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2600);}

function nextMonth(){if(S.currentMonth===12){S.currentMonth=1;S.currentYear++;}else S.currentMonth++;render();}

function setReqStaff(id){S.activeReqStaff=id;render();}
function setMinOffMode(mode){updateStoreRule('minOffMode',mode);}
function updateStoreRule(key,val){if(!S.storeRules[S.activeStore])S.storeRules[S.activeStore]={};S.storeRules[S.activeStore][key]=val;save();render();}
function setStatus(sid,key,val){var sh=gShifts();if(!sh[key])sh[key]={};sh[key][sid]=val;sShifts(sh);}
function setReqType(staffId,key,type){var reqs=gReqs();if(!reqs[key])reqs[key]={};if(type===null){delete reqs[key][staffId];}else{if(reqs[key][staffId]===type)delete reqs[key][staffId];else reqs[key][staffId]=type;}sReqs(reqs);render();}
function colorPickerHtml(cur,fn){var sw=PALETTE.map(function(c){return '<div class="color-swatch'+(c===cur?' selected':'')+'" style="background:'+c+'" onclick="'+fn+'(this.style.background)"></div>';}).join('');return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="color-preview" id="cp-preview" style="background:'+cur+'"></div><span style="font-size:12px;color:var(--ink4)" id="cp-hex">'+cur+'</span></div><div class="color-palette">'+sw+'</div>';}
function pickStaffColor(c){var n=c.replace(/ /g,'');document.querySelectorAll('#cp-staff .color-swatch').forEach(function(el){el.classList.toggle('selected',el.style.background.replace(/ /g,'')==n);});var p=document.getElementById('cp-preview');if(p)p.style.background=n;var h=document.getElementById('cp-hex');if(h)h.textContent=n;window._psc=n;}
function pickStoreColor(c){var n=c.replace(/ /g,'');document.querySelectorAll('#cp-store .color-swatch').forEach(function(el){el.classList.toggle('selected',el.style.background.replace(/ /g,'')==n);});var p=document.getElementById('cp-preview');if(p)p.style.background=n;var h=document.getElementById('cp-hex');if(h)h.textContent=n;window._pstc=n;}
function showModal(title,body,opts){opts=opts||{};var el=document.createElement('div');el.id='modal-layer';el.style.cssText='position:fixed;inset:0;background:rgba(26,24,20,0.4);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:36px;overflow-y:auto';el.innerHTML='<div style="background:var(--surface);border-radius:var(--r-lg);padding:20px;width:'+(opts.width||'340px')+';margin:0 16px;border:1px solid var(--border2)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-family:var(--ff-serif);font-size:17px;color:var(--ink)">'+title+'</span><button class="btn sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div>'+body+'</div>';el.addEventListener('click',function(e){if(e.target===el)closeModal();});document.body.appendChild(el);}

function openAddStaffModal(){var dc=PALETTE[Math.floor(Math.random()*PALETTE.length)];window._psc=dc;showModal('スタッフを追加','<div class="form-row"><label>氏名</label><input type="text" id="m-name" placeholder="田中 花子"></div><div class="form-row"><label>役職</label><select id="m-role"><option>スタイリスト</option><option>アシスタント</option><option>店長</option></select></div><div class="form-row"><label>カラー</label><div id="cp-staff">'+colorPickerHtml(dc,'pickStaffColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="addStaff()">追加する</button></div>',{width:'380px'});}

function openEditStaff(id){var st=S.staff.filter(function(s){return s.id===id;})[0];if(!st)return;window._psc=st.color;var opts=S.stores.map(function(s){return '<option value='+JSON.stringify(s.id)+(s.id===st.store?' selected':'')+'>'+s.name+'</option>';}).join('');showModal('スタッフを編集','<div class="form-row"><label>氏名</label><input type="text" id="m-name" value='+JSON.stringify(st.name)+'></div><div class="form-row"><label>役職</label><select id="m-role"><option'+(st.role==='スタイリスト'?' selected':'')+'>スタイリスト</option><option'+(st.role==='アシスタント'?' selected':'')+'>アシスタント</option><option'+(st.role==='店長'?' selected':'')+'>店長</option></select></div><div class="form-row"><label>担当店舗</label><select id="m-store">'+opts+'</select></div><div class="form-row"><label>カラー</label><div id="cp-staff">'+colorPickerHtml(st.color,'pickStaffColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="editStaff('+id+')">保存する</button></div>',{width:'380px'});}
function editStaff(id){var st=S.staff.filter(function(s){return s.id===id;})[0];if(!st)return;st.name=document.getElementById('m-name').value.trim()||st.name;st.role=document.getElementById('m-role').value;st.store=document.getElementById('m-store').value;st.color=window._psc||st.color;save();closeModal();render();notify('更新しました');}
function removeStaff(id){var st=S.staff.filter(function(s){return s.id===id;})[0];if(!confirm(st.name+'を削除しますか?'))return;S.staff=S.staff.filter(function(s){return s.id!==id;});save();render();}
function openAddStoreModal(){var dc=PALETTE[Math.floor(Math.random()*PALETTE.length)];window._pstc=dc;showModal('店舗を追加','<div class="form-row"><label>店舗名</label><input type="text" id="m-sn" placeholder="D店 表参道"></div><div class="form-row"><label>カラー</label><div id="cp-store">'+colorPickerHtml(dc,'pickStoreColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="addStore()">追加する</button></div>',{width:'380px'});}
function addStore(){var name=document.getElementById('m-sn').value.trim();if(!name)return;S.stores.push({id:name,name:name,color:window._pstc||PALETTE[0]});S.storeRules[name]={satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true};save();closeModal();render();notify(name+'を追加しました');}
function openRenameStore(id){var store=storeById(id);window._pstc=store.color;window._eid=id;showModal('店舗を編集','<div class="form-row"><label>店舗名</label><input type="text" id="m-sn" value='+JSON.stringify(store.name)+'></div><div class="form-row"><label>カラー</label><div id="cp-store">'+colorPickerHtml(store.color,'pickStoreColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="renameStore()">保存する</button></div>',{width:'380px'});}

function deleteStore(id){if(S.stores.length<=1){alert('最低1店舗が必要です');return;}if(!confirm(storeById(id).name+'を削除しますか?'))return;S.stores=S.stores.filter(function(s){return s.id!==id;});S.staff=S.staff.filter(function(s){return s.store!==id;});delete S.storeRules[id];S.activeStore=S.stores[0].id;S.mode='hq';save();render();}
function saveHistory(){var note=prompt('メモを入力(任意)','');if(note===null)return;var now=new Date();S.history.push({year:S.currentYear,month:S.currentMonth,savedAt:now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+('0'+now.getMinutes()).slice(-2),note:note||'',shifts:JSON.parse(JSON.stringify(gShifts())),requests:JSON.parse(JSON.stringify(gReqs())),id:S.nextId++});save();notify('シフトを保存しました');render();}
function loadHistory(idx){var h=S.history[idx];S.currentYear=h.year;S.currentMonth=h.month;S.shifts[h.year+'-'+h.month]=JSON.parse(JSON.stringify(h.shifts));save();notify(h.year+'年'+MONTHS[h.month-1]+'のシフトを読み込みました');render();}
function deleteHistory(idx){if(!confirm('削除しますか?'))return;S.history.splice(idx,1);save();render();}
function autoGenerateStore(sid){var y=S.currentYear,m=S.currentMonth,days=dim(y,m);var reqs=gReqs();var r=S.storeRules[sid]||{};var ss=staffByStore(sid);if(!ss.length)return;var maxOff=parseInt(r.maxMonthlyOff)||8,minOff=calcMinOff(sid,y,m);var sdw=r.sunHolDefaultWork!==false;var minStaff=parseInt(r.minStaff)||1,satMax=parseInt(r.satMaxOff)||3,shMax=parseInt(r.sunHolMaxOff)||1,maxCon=parseInt(r.maxConsec)||5;var wd=[],sat=[],sh=[];for(var d=1;d<=days;d++){var dow=new Date(y,m-1,d).getDay();var dt=dayType(y,m,d);if(dow===0||dt==='hol')sh.push(d);else if(dow===6)sat.push(d);else wd.push(d);}var res={};for(var d2=1;d2<=days;d2++)res[y+'-'+m+'-'+d2]={};var oc={},sc2={};ss.forEach(function(s){oc[s.id]=0;sc2[s.id]=0;});sh.forEach(function(d){if(!sdw)return;var key=y+'-'+m+'-'+d;ss.forEach(function(s){if(isOffReq((reqs[key]||{})[s.id])&&oc[s.id]<maxOff){var tot=ss.filter(function(x){return res[key][x.id]==='off';}).length;if(tot<shMax){res[key][s.id]='off';oc[s.id]++;}else res[key][s.id]='work';}else res[key][s.id]='work';});});sat.forEach(function(d){var key=y+'-'+m+'-'+d;var dm=Math.max(0,ss.length-minStaff);ss.forEach(function(s){if(isOffReq((reqs[key]||{})[s.id])&&oc[s.id]<maxOff&&sc2[s.id]<satMax){var tot=ss.filter(function(x){return res[key][x.id]==='off';}).length;if(tot<dm){res[key][s.id]='off';oc[s.id]++;sc2[s.id]++;}else res[key][s.id]='work';}else res[key][s.id]='work';});});wd.forEach(function(d){var key=y+'-'+m+'-'+d;var dm=Math.max(0,ss.length-minStaff);ss.forEach(function(s){if(isOffReq((reqs[key]||{})[s.id])&&oc[s.id]<maxOff){var tot=ss.filter(function(x){return res[key][x.id]==='off';}).length;if(tot<dm){res[key][s.id]='off';oc[s.id]++;}}});});function cb(sid2,d){var c=0;for(var i=d-1;i>=1;i--){var k=y+'-'+m+'-'+i;if(res[k]&&res[k][sid2]==='off')break;c++;if(c>=maxCon)break;}return c;}['stylist','assistant'].forEach(function(role){var grp=ss.filter(function(s){return role==='stylist'?isStylist(s):!isStylist(s);});if(!grp.length)return;var gdm=Math.max(1,grp.length-Math.max(1,Math.ceil(minStaff*grp.length/ss.length)));grp.forEach(function(s,idx){var ao={};wd.forEach(function(d){if(res[y+'-'+m+'-'+d][s.id]==='off')ao[d]=true;});var aoN=wd.filter(function(d){return ao[d];}).length;var need=Math.max(0,Math.min(maxOff,Math.max(minOff,aoN))-aoN);if(need<=0)return;var avail=wd.filter(function(d){return !ao[d];});if(!avail.length)return;var step=avail.length/need;var off=(step/Math.max(grp.length,1))*idx;for(var i=0;i<need;i++){var ii=Math.round(off+step*i);var placed=false;for(var delta=0;delta<avail.length&&!placed;delta++){var signs=[0,1,-1];for(var si=0;si<signs.length;si++){var sign=signs[si];var ci=ii+(sign===0?0:(sign>0?delta:-delta));if(ci<0||ci>=avail.length)continue;var d=avail[ci];if(ao[d])continue;if(res[y+'-'+m+'-'+d][s.id]==='off')continue;var ro=grp.filter(function(x){return res[y+'-'+m+'-'+d][x.id]==='off';}).length;if(ro>=gdm)continue;var to=ss.filter(function(x){return res[y+'-'+m+'-'+d][x.id]==='off';}).length;if(to>=ss.length-minStaff)continue;if(cb(s.id,d)>=maxCon)continue;if(oc[s.id]>=maxOff)break;res[y+'-'+m+'-'+d][s.id]='off';oc[s.id]++;ao[d]=true;placed=true;break;}}}});});for(var d3=1;d3<=days;d3++){var key=y+'-'+m+'-'+d3;ss.forEach(function(s){if(!res[key][s.id])res[key][s.id]='work';});}var ex=gShifts();Object.keys(res).forEach(function(k){ex[k]=res[k];});sShifts(ex);notify(storeById(sid).name+' のシフトを振り分けました');render();}
function autoGenerateAll(){S.stores.forEach(function(s){autoGenerateStore(s.id);});notify('全店舗のシフトを振り分けました');}
function validateStore(sid,shifts,y,m){var days=dim(y,m);var r=S.storeRules[sid]||{};var ss=staffByStore(sid);var warns=[];var minOff=calcMinOff(sid,y,m);var satOff={};var offCnt={};ss.forEach(function(s){satOff[s.id]=0;offCnt[s.id]=0;});for(var d=1;d<=days;d++){var key=y+'-'+m+'-'+d;var day=shifts[key]||{};var dt=dayType(y,m,d);var dobj=new Date(y,m-1,d);var working=ss.filter(function(s){return day[s.id]==='work';});var oc=ss.filter(function(s){return day[s.id]==='off';}).length;if(working.length<(r.minStaff||1)&&Object.keys(day).length>0)warns.push(m+'/'+d+' 最低人数不足('+working.length+'/'+r.minStaff+'名)');if((dt==='sun'||dt==='hol')&&oc>(r.sunHolMaxOff||1))warns.push(m+'/'+d+' 日祝休み超過('+oc+'名)');ss.forEach(function(s){if(day[s.id]==='off'){offCnt[s.id]++;if(dobj.getDay()===6)satOff[s.id]++;}});}ss.forEach(function(s){if(satOff[s.id]>(r.satMaxOff||3))warns.push(s.name+' 土曜休み超過('+satOff[s.id]+'回)');if(Object.keys(shifts).length>0&&offCnt[s.id]<minOff)warns.push(s.name+' 休日不足('+offCnt[s.id]+'日/最低'+minOff+'日)');if(offCnt[s.id]>(r.maxMonthlyOff||8))warns.push(s.name+' 休日超過('+offCnt[s.id]+'日/最大'+r.maxMonthlyOff+'日)');});return warns;}
function validateAll(shifts,y,m){var all=[];S.stores.forEach(function(st){validateStore(st.id,shifts,y,m).forEach(function(w){all.push('['+st.name+'] '+w);});});return all;}

function renderStaff(){window._STI=staffByStore(S.activeStore).map(function(s){return s.id;});var ss=staffByStore(S.activeStore);var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title" style="margin:0">在籍スタッフ</div><button class="btn gold sm" onclick="openAddStaffModal()"><i class="ti ti-plus"></i>追加</button></div>';if(!ss.length)return h+'<div style="text-align:center;padding:40px;color:var(--ink4);font-family:var(--ff-serif)">スタッフが登録されていません</div>';ss.forEach(function(st,i){h+='<div class="staff-row"><div class="avatar" style="width:34px;height:34px;background:'+st.color+'18;color:'+st.color+'">'+ini(st.name)+'</div><div style="flex:1"><div style="font-size:13px;color:var(--ink)">'+st.name+'</div><div style="font-size:11px;color:var(--ink4);margin-top:1px">'+st.role+'</div></div><button class="btn sm" onclick="_es('+i+')"><i class="ti ti-edit"></i></button><button class="btn sm danger" onclick="_rm('+i+')"><i class="ti ti-trash"></i></button></div>';});return h;}
function renderRules(){var r=S.storeRules[S.activeStore]||{};var mode=r.minOffMode||'weekly2';var minOff=calcMinOff(S.activeStore,S.currentYear,S.currentMonth);return'<div class="card"><div class="card-title">最低休日数</div><div style="font-size:11px;color:var(--ink4);margin-bottom:10px">今月の最低休日数: <strong style="color:var(--gold);font-size:13px">'+minOff+'日</strong></div><div class="radio-card'+(mode==='weekly2'?' selected':'')+'" onclick="setMinOffMode('weekly2')"><input type="radio" name="mo" '+(mode==='weekly2'?'checked':'')+' style="margin-top:2px"><div><div class="radio-card-title">完全週休二日</div><div class="radio-card-sub">週ごとに2日休み(今月は'+minOff+'日)</div></div></div><div class="radio-card'+(mode==='fixed'?' selected':'')+'" onclick="setMinOffMode('fixed')"><input type="radio" name="mo" '+(mode==='fixed'?'checked':'')+' style="margin-top:2px"><div style="flex:1"><div class="radio-card-title">日数を指定</div><div class="radio-card-sub">固定の最低休日数を設定</div>'+(mode==='fixed'?'<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><input type="number" value="'+(r.minOffDays||8)+'" min="1" max="20" style="width:68px" oninput="updateStoreRule('minOffDays',parseInt(this.value)||1)" onclick="event.stopPropagation()"><span style="font-size:12px;color:var(--ink4)">日/月</span></div>':'')+'</div></div></div><div class="card"><div class="card-title">土日祝ルール</div><div class="checkbox-row"><input type="checkbox" id="shw" '+(r.sunHolDefaultWork?'checked':'')+' onchange="updateStoreRule('sunHolDefaultWork',this.checked)"><label for="shw" style="text-transform:none;letter-spacing:normal;font-size:13px;color:var(--ink2);margin:0">土日祝は希望休がない限り出勤とする</label></div><div class="rule-note">ONの場合: 希望休を出したスタッフのみ休み。</div><div style="height:10px"></div><div class="form-row"><label>年間の土曜休み上限(1人あたり)</label><div style="display:flex;align-items:center;gap:8px"><input type="number" value="'+(r.satMaxOff||3)+'" min="0" max="52" style="width:72px" onchange="updateStoreRule('satMaxOff',parseInt(this.valu function renderHistPanel(){var h='<div class="card-title">保存済みシフト</div>';if(!S.history.length)return h+'<div style="text-align:center;padding:40px;color:var(--ink4);font-family:var(--ff-serif)"><i class="ti ti-calendar-off" style="font-size:28px;display:block;margin-bottom:8px"></i>保存された履歴はありません</div>';S.history.slice().reverse().forEach(function(item,ri){var idx=S.history.length-1-ri;h+='<div class="history-item" onclick="_lh('+idx+')"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-family:var(--ff-serif);font-size:15px;color:var(--ink)">'+item.year+'年 '+MONTHS[item.month-1]+' シフト</div><div style="font-size:11px;color:var(--ink4);margin-top:3px"><i class="ti ti-clock" style="font-size:10px"></i> '+item.savedAt+'</div>'+(item.note?'<div style="font-size:11px;color:var(--ink3);margin-top:3px">'+item.note+'</div>':'')+'</div><div style="display:flex;gap:5px"><button class="btn sm" onclick="event.stopPropagation();_lh('+idx+')"><i class="ti ti-eye"></i></button><button class="btn sm danger" onclick="event.stopPropagation();_dh('+idx+')"><i class="ti ti-trash"></i></button></div></div></div>';});return h;}
