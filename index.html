<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1814;--ink2:#3d3a35;--ink3:#6b6760;--ink4:#9c9890;--surface:#faf9f7;--surface2:#f3f1ed;--surface3:#ede9e3;--gold:#b8922a;--gold-light:#e8d5a3;--gold-pale:#fdf6e7;--border:#e2ddd5;--border2:#cec9bf;--sat-bg:#f5f2ff;--sun-bg:#fff6f6;--sat-text:#4a3fa0;--sun-text:#a03030;--lesson-bg:#e8f4ff;--lesson-color:#1a5fa0;--other-bg:#f0ffe8;--other-color:#2a6a2a;--ff-serif:'Cormorant Garamond',serif;--ff-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--r:8px;--r-lg:12px}
html,body{height:100%;font-family:var(--ff-sans)}
.app{background:var(--surface);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.wordmark{padding:0 18px;display:flex;align-items:center;gap:8px;border-right:1px solid var(--border)}
.wordmark-text{font-family:var(--ff-serif);font-size:16px;letter-spacing:.04em;color:var(--ink);font-weight:500}
.wordmark-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.nav-tabs{display:flex;flex:1}
.nav-tab{padding:0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.nav-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.nav-tab:hover:not(.active){color:var(--ink2);background:var(--surface2)}
.store-bar{display:flex;align-items:center;gap:5px;padding:6px 14px;border-left:1px solid var(--border);flex-wrap:wrap}
.store-chip{padding:4px 11px;border-radius:20px;font-size:11px;letter-spacing:.04em;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink3);transition:all .15s;white-space:nowrap}
.store-chip.active{background:var(--ink);color:#faf9f7;border-color:var(--ink)}
.store-chip:hover:not(.active){border-color:var(--gold);color:var(--gold)}
.store-chip.add{border-style:dashed;color:var(--ink4)}
.content{padding:20px;flex:1}
.btn{padding:7px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink2);transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--ink);color:#faf9f7;border-color:var(--ink)}
.btn.gold:hover{background:var(--ink2)}
.btn.ghost-gold{border-color:var(--gold-light);color:var(--gold);background:var(--gold-pale)}
.btn.ghost-gold:hover{background:var(--gold-light)}
.btn.sm{padding:4px 10px;font-size:10px}
.btn.danger{border-color:#e2b8b8;color:#a03030}
.btn.danger:hover{background:#fff6f6}
.divider{height:1px;background:var(--border);margin:16px 0}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.card-title{font-family:var(--ff-serif);font-size:15px;letter-spacing:.02em;color:var(--ink);font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:block}
label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);display:block;margin-bottom:4px}
input,select{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;color:var(--ink);outline:none;font-family:var(--ff-sans)}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,146,42,.12)}
.form-row{margin-bottom:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;text-align:center}
.stat-num{font-family:var(--ff-serif);font-size:28px;color:var(--ink);font-weight:400}
.stat-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);margin-top:4px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0;font-size:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;letter-spacing:.05em}
.badge.ok{background:#f0f8f0;color:#2d6a2d;border:1px solid #c5dfc5}
.badge.warn{background:#fff8ec;color:#8a5a00;border:1px solid #e8d5a3}
.badge.neutral{background:var(--surface2);color:var(--ink3);border:1px solid var(--border)}
.alert{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.alert.warn{background:#fff8ec;color:#7a4f00;border:1px solid #e8d5a3}
.alert.ok{background:#f0f8f0;color:#1e4d1e;border:1px solid #c5dfc5}
.alert.info{background:var(--gold-pale);color:var(--gold);border:1px solid var(--gold-light)}
.staff-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.staff-row:last-child{border-bottom:none}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-head{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);padding:4px}
.cal-head.sat{color:var(--sat-text)}.cal-head.sun{color:var(--sun-text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{border:1px solid var(--border);border-radius:6px;padding:4px 5px;min-height:54px;cursor:pointer;background:#fff;transition:border-color .12s}
.cal-cell:hover{border-color:var(--gold)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.sat-cell{background:var(--sat-bg)}.cal-cell.sun-cell{background:var(--sun-bg)}
.cal-date{font-size:11px;font-weight:500;color:var(--ink);margin-bottom:2px}
.cal-date.sat{color:var(--sat-text)}.cal-date.sun,.cal-date.hol{color:var(--sun-text)}
.off-chip{border-radius:3px;padding:1px 4px;font-size:9px;margin-top:1px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-bar{height:3px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px;background:var(--gold)}.progress-fill.over{background:#c04040}
.hq-store-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;background:#fff}
.hq-store-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--border)}
.hq-store-head:hover{background:var(--surface2)}
.hq-store-body{padding:14px 16px;background:var(--surface)}
.store-accent{width:3px;border-radius:2px;flex-shrink:0}
.cal-table{border-collapse:collapse;width:100%;font-size:11px}
.cal-table th{padding:4px 3px;text-align:center;font-weight:400;color:var(--ink4);border-bottom:1px solid var(--border);white-space:nowrap}
.cal-table td{padding:2px 3px;text-align:center;border:1px solid var(--border);height:26px;vertical-align:middle;background:#fff}
.cal-table td.sat-col{background:var(--sat-bg)}.cal-table td.sun-col{background:var(--sun-bg)}
.cell-off{background:var(--gold-pale);color:var(--gold);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid var(--gold-light)}
.cell-work{color:var(--border2);font-size:10px}
.cell-lesson{background:var(--lesson-bg);color:var(--lesson-color);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid #a8d4f0}
.cell-other{background:var(--other-bg);color:var(--other-color);border-radius:2px;padding:1px 3px;font-size:9px;display:inline-block;border:1px solid #a8d4a0}
.history-item{padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:6px;cursor:pointer;background:#fff;transition:all .15s}
.history-item:hover{border-color:var(--gold);background:var(--gold-pale)}
.tab-inner{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab-inner-btn{padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-inner-btn.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.tab-inner-btn:hover:not(.active){color:var(--ink2)}
.summary-table{width:100%;border-collapse:collapse;font-size:12px}
.summary-table th{padding:6px 10px;text-align:left;font-weight:400;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);border-bottom:1px solid var(--border);background:var(--surface2)}
.summary-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--ink)}
.summary-table tr:last-child td{border-bottom:none}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--ink2)}
input[type=checkbox],input[type=radio]{width:auto}
.notif-wrap{padding:0 20px}
.notif{display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);font-size:12px;margin-top:10px;background:var(--ink);color:#faf9f7}
.notif.show{display:flex}
.rule-note{font-size:11px;color:var(--ink4);margin-top:6px;padding:8px 10px;background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:var(--r);line-height:1.6}
.req-cal-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.req-cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.req-cal-dow{text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0;color:var(--ink4)}
.req-cal-dow.sat{color:var(--sat-text)}.req-cal-dow.sun{color:var(--sun-text)}
.req-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.req-day{border:1px solid var(--border);border-radius:8px;min-height:76px;background:var(--surface);cursor:pointer;transition:border-color .12s;overflow:hidden;display:flex;flex-direction:column}
.req-day:hover{border-color:var(--gold)}
.req-day.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.req-day.sat{background:var(--sat-bg)}.req-day.sun{background:var(--sun-bg)}
.req-day-num{font-size:12px;font-weight:500;padding:5px 7px 2px}
.req-day-num.sat{color:var(--sat-text)}.req-day-num.sun,.req-day-num.hol{color:var(--sun-text)}
.staff-tab-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.staff-tab{padding:8px 14px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s;flex-shrink:0}
.staff-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.staff-tab:hover:not(.active){color:var(--ink2)}
.radio-card{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);cursor:pointer;transition:all .15s;margin-bottom:8px;background:#fff}
.radio-card.selected{border-color:var(--gold);background:var(--gold-pale)}
.radio-card-title{font-size:13px;font-weight:500;color:var(--ink)}
.radio-card-sub{font-size:11px;color:var(--ink4);margin-top:2px}
.req-type-btn{border:1px solid var(--border2);border-radius:4px;padding:3px 6px;font-size:9px;cursor:pointer;transition:all .12s;background:transparent;display:block;width:100%;text-align:center;margin-top:2px;white-space:nowrap}
.req-type-btn.off{border-color:#c8a84a;color:var(--gold);background:var(--gold-pale)}
.req-type-btn.lesson{border-color:#a8d4f0;color:var(--lesson-color);background:var(--lesson-bg)}
.req-type-btn.other{border-color:#a8d4a0;color:var(--other-color);background:var(--other-bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.color-palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.15)}.color-swatch.selected{border-color:var(--ink);transform:scale(1.1)}
.color-preview{width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);flex-shrink:0}
.sync-bar{padding:6px 20px;font-size:11px;color:var(--ink4);background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#c5dfc5;flex-shrink:0}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:#c04040}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar"></div>
  <div class="sync-bar" id="sync-bar"><div class="sync-dot" id="sync-dot"></div><span id="sync-msg">読み込み中...</span></div>
  <div class="notif-wrap"><div class="notif" id="notif"><i class="ti ti-check"></i><span id="notif-msg"></span></div></div>
  <div class="content" id="content"></div>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycby5AbHfQFkEbks774BzVS3TgLaG-Zx3YVgdhLuq6nFLCEpYtYZlKQN3iiVDNAwvO5g/exec';
const SAVE_KEY='salonAtelier';
const LEGACY_KEYS=['salonLux8','salonLux7','salonLux6','salonLux5','salonLux4','salonLux3','salonLux2','salonLux','salonHQ2','salonShift'];
function syncStatus(state,msg){const dot=document.getElementById('sync-dot');const msgEl=document.getElementById('sync-msg');if(!dot||!msgEl)return;dot.className='sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':'');msgEl.textContent=msg;}
function gasLoad(cb){syncStatus('syncing','サーバーから読み込み中...');const cbName='_gasLoad_'+Date.now();const script=document.createElement('script');let done=false;window[cbName]=function(res){done=true;delete window[cbName];if(document.body.contains(script))document.body.removeChild(script);if(res&&res.success&&res.data){syncStatus('ok','同期済み');cb(null,res.data);}else{syncStatus('ok','ローカルデータを使用');cb(null,null);}};script.onerror=function(){if(!done){done=true;syncStatus('error','オフライン（ローカルデータを使用）');cb('error',null);}};setTimeout(function(){if(!done){done=true;syncStatus('error','タイムアウト');cb('timeout',null);}},10000);script.src=GAS_URL+'?action=load&callback='+cbName;document.body.appendChild(script);}
function gasSave(data){syncStatus('syncing','保存中...');const cbName='_gasSave_'+Date.now();const script=document.createElement('script');window[cbName]=function(res){delete window[cbName];if(document.body.contains(script))document.body.removeChild(script);syncStatus('ok',res&&res.success?'保存しました':'保存エラー');setTimeout(()=>syncStatus('ok','同期済み'),2000);};script.onerror=function(){syncStatus('error','保存失敗（ローカルのみ）');};const encoded=encodeURIComponent(data);script.src=GAS_URL+'?action=save&data='+encoded+'&callback='+cbName;document.body.appendChild(script);}
const PALETTE=['#b8922a','#8b6914','#c47a3a','#2d5a8a','#4a6fa5','#1a3a6a','#3d7a5a','#5a8a5a','#2d6a4a','#8a4a2d','#a05030','#6a3020','#6a3d8a','#8a5aaa','#4a2d6a','#2d7a7a','#3a9a9a','#1a5a5a','#8a3d6a','#aa5a8a','#6a2050','#5a6a8a','#7a8aaa','#3a4a6a','#6a6a3a','#8a8a5a','#4a4a2a','#8a3a3a','#aa5a5a','#6a2a2a'];
const REQ_TYPES={off_req:{label:'休み希望',short:'休み希望',color:'var(--gold)',bg:'var(--gold-pale)',border:'#c8a84a'},lesson:{label:'社内レッスン',short:'レッスン',color:'var(--lesson-color)',bg:'var(--lesson-bg)',border:'#a8d4f0'},other_store:{label:'他店舗出勤',short:'他店舗',color:'var(--other-color)',bg:'var(--other-bg)',border:'#a8d4a0'}};
const DEFAULT={mode:'hq',activeStore:'A店',activeStoreTab:'shift',activeReqStaff:null,currentYear:2025,currentMonth:6,stores:[{id:'A店',name:'A店 渋谷',color:'#b8922a'},{id:'B店',name:'B店 新宿',color:'#4a6fa5'},{id:'C店',name:'C店 銀座',color:'#5a8a5a'}],staff:[{id:1,name:'田中 花子',role:'スタイリスト',color:'#8b6914',store:'A店'},{id:2,name:'山田 太郎',role:'スタイリスト',color:'#2d5a8a',store:'A店'},{id:3,name:'佐藤 めぐみ',role:'アシスタント',color:'#3d7a5a',store:'A店'},{id:4,name:'鈴木 健一',role:'スタイリスト',color:'#8a4a2d',store:'B店'},{id:5,name:'高橋 あゆみ',role:'アシスタント',color:'#6a3d8a',store:'B店'},{id:6,name:'伊藤 直樹',role:'スタイリスト',color:'#2d7a7a',store:'C店'},{id:7,name:'渡辺 さくら',role:'アシスタント',color:'#8a3d6a',store:'C店'}],storeRules:{'A店':{satMaxOff:3,sunHolMaxOff:1,minStaff:2,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true},'B店':{satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true},'C店':{satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true}},shifts:{},requests:{},history:[],nextId:100,hqCollapsed:{}};
let S=null;
function loadLocalData(){try{const cur=localStorage.getItem(SAVE_KEY);if(cur)return JSON.parse(cur);}catch(e){}for(const key of LEGACY_KEYS){try{const d=localStorage.getItem(key);if(d)return JSON.parse(d);}catch(e){}}return null;}
function initState(data){S=data||JSON.parse(JSON.stringify(DEFAULT));if(!S.storeRules)S.storeRules={};if(!S.hqCollapsed)S.hqCollapsed={};if(S.activeReqStaff===undefined)S.activeReqStaff=null;if(!S.stores)S.stores=DEFAULT.stores;if(!S.staff)S.staff=DEFAULT.staff;if(!S.shifts)S.shifts={};if(!S.requests)S.requests={};if(!S.history)S.history=[];if(!S.nextId)S.nextId=100;S.stores.forEach(st=>{if(!S.storeRules[st.id])S.storeRules[st.id]={satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true};const r=S.storeRules[st.id];if(!r.minOffMode)r.minOffMode='weekly2';if(r.minOffDays===undefined)r.minOffDays=8;if(r.sunHolDefaultWork===undefined)r.sunHolDefaultWork=true;});}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}gasSave(JSON.stringify(S));}
const localData=loadLocalData();initState(localData);render();syncStatus('ok',localData?'ローカルデータを読み込みました':'初期データを使用');
gasLoad(function(err,gasData){if(gasData){try{const parsed=JSON.parse(gasData);initState(parsed);try{localStorage.setItem(SAVE_KEY,gasData);}catch(e){}render();syncStatus('ok','同期済み');}catch(e){syncStatus('error','データの解析に失敗しました');}}});
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DAYS=['日','月','火','水','木','金','土'];
const JP_HOL=['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-07-20','2026-08-11','2026-09-21','2026-09-23','2026-10-12','2026-11-03','2026-11-23'];
function isHol(y,m,d){return JP_HOL.includes(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));}
function dayType(y,m,d){const dow=new Date(y,m-1,d).getDay();if(isHol(y,m,d))return'hol';if(dow===0)return'sun';if(dow===6)return'sat';return'wd';}
function dim(y,m){return new Date(y,m,0).getDate();}
function fdow(y,m){return new Date(y,m-1,1).getDay();}
function sk(){return S.currentYear+'-'+S.currentMonth;}
function gShifts(){return S.shifts[sk()]||{};}
function sShifts(d){S.shifts[sk()]=d;save();}
function gReqs(){return S.requests[sk()]||{};}
function sReqs(d){S.requests[sk()]=d;save();}
function staffByStore(sid){return S.staff.filter(s=>s.store===sid);}
function ini(n){return n.split(' ').map(x=>x[0]||'').join('').slice(0,2);}
function storeById(id){return S.stores.find(s=>s.id===id)||{};}
function isOffReq(v){return v==='off_req';}
function isStylist(s){return s.role==='スタイリスト'||s.role==='店長';}
function calcMinOff(sid,y,m){const r=S.storeRules[sid]||{};if(r.minOffMode==='weekly2'){let w=0;const days=dim(y,m);for(let d=1;d<=days;d++)if(new Date(y,m-1,d).getDay()===1)w++;return w*2;}return parseInt(r.minOffDays)||8;}
function notify(msg){const el=document.getElementById('notif');if(!el)return;document.getElementById('notif-msg').textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);}
function render(){renderTopbar();if(S.mode==='hq')renderHQ();else renderStore();}
function setMode(m){S.mode=m;render();}
function switchStore(id){S.activeStore=id;S.mode='store';S.activeStoreTab='shift';render();}
function prevMonth(){if(S.currentMonth===1){S.currentMonth=12;S.currentYear--;}else S.currentMonth--;render();}
function nextMonth(){if(S.currentMonth===12){S.currentMonth=1;S.currentYear++;}else S.currentMonth++;render();}
function toggleCollapse(id){S.hqCollapsed[id]=!S.hqCollapsed[id];render();}
function setStoreTab(t){S.activeStoreTab=t;render();}
function setReqStaff(id){S.activeReqStaff=id;render();}
function setMinOffMode(mode){updateStoreRule('minOffMode',mode);}
function updateStoreRule(key,val){if(!S.storeRules[S.activeStore])S.storeRules[S.activeStore]={};S.storeRules[S.activeStore][key]=val;save();render();}
function renderTopbar(){const bar=document.getElementById('topbar');const chips=S.stores.map(st=>'<button class="store-chip'+(S.mode==='store'&&S.activeStore===st.id?' active':'')+'" onclick="switchStore(\'' +st.id+ '\')"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:'+st.color+';margin-right:5px;vertical-align:middle"></span>'+st.name+'</button>').join('');bar.innerHTML='<div class="wordmark"><div class="wordmark-dot"></div><span class="wordmark-text">Atelier Shift</span></div><div class="nav-tabs"><button class="nav-tab'+(S.mode==='hq'?' active':'')+'" onclick="setMode(\'hq\')"><i class="ti ti-building"></i>本部</button><button class="nav-tab'+(S.mode==='store'?' active':'')+'" onclick="if(S.mode!==\'store\'){S.activeStore=S.stores[0].id;S.mode=\'store\';render();}"><i class="ti ti-tool"></i>店舗管理</button></div><div class="store-bar">'+chips+'<button class="store-chip add" onclick="openAddStoreModal()"><i class="ti ti-plus" style="font-size:11px"></i></button></div>';}
function autoGenerateStore(sid){const y=S.currentYear,m=S.currentMonth,days=dim(y,m);const reqs=gReqs();const r=S.storeRules[sid]||{};const ss=staffByStore(sid);if(!ss.length)return;const maxOff=parseInt(r.maxMonthlyOff)||8,minOff=calcMinOff(sid,y,m);const sunHolDefaultWork=r.sunHolDefaultWork!==false;const minStaff=parseInt(r.minStaff)||1,satMax=parseInt(r.satMaxOff)||3,sunHolMax=parseInt(r.sunHolMaxOff)||1,maxConsec=parseInt(r.maxConsec)||5;const weekdays=[],saturdays=[],sunhols=[];for(let d=1;d<=days;d++){const dt=new Date(y,m-1,d);const dow=dt.getDay();const dType=dayType(y,m,d);if(dow===0||dType==='hol')sunhols.push(d);else if(dow===6)saturdays.push(d);else weekdays.push(d);}const result={};for(let d=1;d<=days;d++)result[y+'-'+m+'-'+d]={};const offCount={},satOffCount={};ss.forEach(s=>{offCount[s.id]=0;satOffCount[s.id]=0;});sunhols.forEach(d=>{if(!sunHolDefaultWork)return;const key=y+'-'+m+'-'+d;ss.forEach(s=>{if(isOffReq((reqs[key]||{})[s.id])&&offCount[s.id]<maxOff){const tot=ss.filter(x=>result[key][x.id]==='off').length;if(tot<sunHolMax){result[key][s.id]='off';offCount[s.id]++;}else result[key][s.id]='work';}else result[key][s.id]='work';});});saturdays.forEach(d=>{const key=y+'-'+m+'-'+d;const dayMaxOff=Math.max(0,ss.length-minStaff);ss.forEach(s=>{if(isOffReq((reqs[key]||{})[s.id])&&offCount[s.id]<maxOff&&satOffCount[s.id]<satMax){const tot=ss.filter(x=>result[key][x.id]==='off').length;if(tot<dayMaxOff){result[key][s.id]='off';offCount[s.id]++;satOffCount[s.id]++;}else result[key][s.id]='work';}else result[key][s.id]='work';});});weekdays.forEach(d=>{const key=y+'-'+m+'-'+d;const dayMaxOff=Math.max(0,ss.length-minStaff);ss.forEach(s=>{if(isOffReq((reqs[key]||{})[s.id])&&offCount[s.id]<maxOff){const tot=ss.filter(x=>result[key][x.id]==='off').length;if(tot<dayMaxOff){result[key][s.id]='off';offCount[s.id]++;}}});});function consecBefore(staffId,d){let c=0;for(let i=d-1;i>=1;i--){const k=y+'-'+m+'-'+i;if(result[k]&&result[k][staffId]==='off')break;c++;if(c>=maxConsec)break;}return c;}['stylist','assistant'].forEach(role=>{const group=ss.filter(s=>role==='stylist'?isStylist(s):!isStylist(s));if(!group.length)return;const groupDayMaxOff=Math.max(1,group.length-Math.max(1,Math.ceil(minStaff*group.length/ss.length)));group.forEach((s,idx)=>{const alreadyOff=new Set(weekdays.filter(d=>result[y+'-'+m+'-'+d][s.id]==='off'));const need=Math.max(0,Math.min(maxOff,Math.max(minOff,alreadyOff.size))-alreadyOff.size);if(need<=0)return;const avail=weekdays.filter(d=>!alreadyOff.has(d));if(!avail.length)return;const step=avail.length/need;const offsetFrac=(step/Math.max(group.length,1))*idx;for(let i=0;i<need;i++){const idealIdx=Math.round(offsetFrac+step*i);let placed=false;for(let delta=0;delta<avail.length&&!placed;delta++){for(const sign of[0,1,-1]){const ci=idealIdx+(sign===0?0:(sign>0?delta:-delta));if(ci<0||ci>=avail.length)continue;const d=avail[ci];if(alreadyOff.has(d))continue;if(result[y+'-'+m+'-'+d][s.id]==='off')continue;const roleOff=group.filter(x=>result[y+'-'+m+'-'+d][x.id]==='off').length;if(roleOff>=groupDayMaxOff)continue;const totOff=ss.filter(x=>result[y+'-'+m+'-'+d][x.id]==='off').length;if(totOff>=ss.length-minStaff)continue;if(consecBefore(s.id,d)>=maxConsec)continue;if(offCount[s.id]>=maxOff)break;result[y+'-'+m+'-'+d][s.id]='off';offCount[s.id]++;alreadyOff.add(d);placed=true;break;}}}}});});for(let d=1;d<=days;d++){const key=y+'-'+m+'-'+d;ss.forEach(s=>{if(!result[key][s.id])result[key][s.id]='work';});}const existing=gShifts();Object.assign(existing,result);sShifts(existing);notify(storeById(sid).name+' のシフトを振り分けました');render();}
function autoGenerateAll(){S.stores.forEach(s=>autoGenerateStore(s.id));notify('全店舗のシフトを振り分けました');}
function validateStore(sid,shifts,y,m){const days=dim(y,m);const r=S.storeRules[sid]||{};const ss=staffByStore(sid);const warns=[];const minOff=calcMinOff(sid,y,m);const satOff={};const offCnt={};ss.forEach(s=>{satOff[s.id]=0;offCnt[s.id]=0;});for(let d=1;d<=days;d++){const key=y+'-'+m+'-'+d;const day=shifts[key]||{};const dType=dayType(y,m,d);const dt=new Date(y,m-1,d);const working=ss.filter(s=>day[s.id]==='work');const oc=ss.filter(s=>day[s.id]==='off').length;if(working.length<(r.minStaff||1)&&Object.keys(day).length>0)warns.push(m+'/'+d+' 最低人数不足（'+working.length+'/'+r.minStaff+'名）');if((dType==='sun'||dType==='hol')&&oc>(r.sunHolMaxOff||1))warns.push(m+'/'+d+' 日祝休み超過（'+oc+'名）');ss.forEach(s=>{if(day[s.id]==='off'){offCnt[s.id]++;if(dt.getDay()===6)satOff[s.id]++;}});}ss.forEach(s=>{if(satOff[s.id]>(r.satMaxOff||3))warns.push(s.name+' 土曜休み超過（'+satOff[s.id]+'回）');if(Object.keys(shifts).length>0&&offCnt[s.id]<minOff)warns.push(s.name+' 休日不足（'+offCnt[s.id]+'日／最低'+minOff+'日）');if(offCnt[s.id]>(r.maxMonthlyOff||8))warns.push(s.name+' 休日超過（'+offCnt[s.id]+'日／最大'+r.maxMonthlyOff+'日）');});return warns;}
function validateAll(shifts,y,m){let all=[];S.stores.forEach(st=>{validateStore(st.id,shifts,y,m).forEach(w=>all.push('['+st.name+'] '+w));});return all;}
function renderHQ(){const c=document.getElementById('content');const y=S.currentYear,m=S.currentMonth,shifts=gShifts(),days=dim(y,m);let totalOff=0;S.staff.forEach(st=>{for(let d=1;d<=days;d++){if((shifts[y+'-'+m+'-'+d]||{})[st.id]==='off')totalOff++;}});const alerts=validateAll(shifts,y,m);let h='<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px"><div><div style="font-family:var(--ff-serif);font-size:22px;color:var(--ink)">本部ダッシュボード</div><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);margin-top:3px">'+y+'年 '+MONTHS[m-1]+'</div></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn sm" onclick="prevMonth()"><i class="ti ti-chevron-left"></i></button><button class="btn sm" onclick="nextMonth()"><i class="ti ti-chevron-right"></i></button><button class="btn ghost-gold" onclick="autoGenerateAll()"><i class="ti ti-wand"></i>全店自動振り分け</button><button class="btn gold" onclick="saveHistory()"><i class="ti ti-device-floppy"></i>保存</button></div></div>';h+='<div class="grid4" style="margin-bottom:16px"><div class="stat-card"><div class="stat-num">'+S.stores.length+'</div><div class="stat-label">店舗数</div></div><div class="stat-card"><div class="stat-num">'+S.staff.length+'</div><div class="stat-label">総スタッフ</div></div><div class="stat-card"><div class="stat-num" style="'+(alerts.length>0?'color:#c04040':'')+'">'+alerts.length+'</div><div class="stat-label">警告件数</div></div><div class="stat-card"><div class="stat-num">'+totalOff+'</div><div class="stat-label">今月総休日数</div></div></div>';if(alerts.length>0){alerts.slice(0,3).forEach(a=>h+='<div class="alert warn"><i class="ti ti-alert-triangle"></i>'+a+'</div>');if(alerts.length>3)h+='<div class="alert info"><i class="ti ti-info-circle"></i>他 '+(alerts.length-3)+' 件</div>';}else if(Object.keys(shifts).length>0)h+='<div class="alert ok"><i class="ti ti-circle-check"></i>全店舗のシフトに問題はありません</div>';S.stores.forEach(store=>{const ss=staffByStore(store.id);const collapsed=S.hqCollapsed[store.id];let sw=0,so=0;ss.forEach(st=>{for(let d=1;d<=days;d++){const s=(shifts[y+'-'+m+'-'+d]||{})[st.id];if(s==='off')so++;else if(s==='work')sw++;}});const sa=validateStore(store.id,shifts,y,m);h+='<div class="hq-store-card"><div class="hq-store-head" onclick="toggleCollapse(\''+store.id+'\')"><div style="display:flex;align-items:center;gap:10px"><div class="store-accent" style="background:'+store.color+';height:16px"></div><span style="font-family:var(--ff-serif);font-size:16px;color:var(--ink)">'+store.name+'</span><span class="badge neutral">'+ss.length+'名</span>'+(sa.length>0?'<span class="badge warn"><i class="ti ti-alert-triangle" style="font-size:10px"></i> '+sa.length+'件</span>':'<span class="badge ok"><i class="ti ti-check" style="font-size:10px"></i> 正常</span>')+'</div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;color:var(--ink4)">出勤 '+sw+' ／ 休 '+so+'</span><button class="btn sm" onclick="event.stopPropagation();switchStore(\''+store.id+'\')"><i class="ti ti-edit"></i>編集</button><i class="ti ti-chevron-'+(collapsed?'down':'up')+'" style="font-size:13px;color:var(--ink4)"></i></div></div>';if(!collapsed)h+='<div class="hq-store-body">'+renderHQCal(store.id,shifts,y,m,ss)+renderMiniSummary(store.id,shifts,y,m)+'</div>';h+='</div>';});h+=renderHistoryPanel();c.innerHTML=h;}
function renderHQCal(sid,shifts,y,m,ss){const reqs=gReqs();const days=dim(y,m);let h='<div style="overflow-x:auto"><table class="cal-table"><thead><tr><th style="text-align:left;padding:4px 8px;min-width:88px">スタッフ</th>';for(let d=1;d<=days;d++){const dow=new Date(y,m-1,d).getDay();const dType=dayType(y,m,d);let lbl=dow===0||dType==='hol'?'<span style="color:var(--sun-text)">'+d+'</span>':dow===6?'<span style="color:var(--sat-text)">'+d+'</span>':''+d;h+='<th style="min-width:20px">'+lbl+'</th>';}h+='</tr></thead><tbody>';ss.forEach(st=>{h+='<tr><td style="padding:3px 8px;white-space:nowrap"><div style="display:flex;align-items:center;gap:5px"><div class="avatar" style="width:20px;height:20px;background:'+st.color+'18;color:'+st.color+'">'+ini(st.name)+'</div><span style="font-size:11px">'+(st.name.split(' ')[1]||st.name).slice(0,4)+'</span></div></td>';for(let d=1;d<=days;d++){const key=y+'-'+m+'-'+d;const s=(shifts[key]||{})[st.id];const rv=(reqs[key]||{})[st.id];const dType=dayType(y,m,d);const cls=dType==='sat'?'sat-col':dType==='sun'||dType==='hol'?'sun-col':'';let cell=s==='off'?'<span class="cell-off">休</span>':rv==='lesson'?'<span class="cell-lesson">研</span>':rv==='other_store'?'<span class="cell-other">他</span>':s==='work'?'<span class="cell-work">•</span>':'';h+='<td class="'+cls+'">'+cell+'</td>';}h+='</tr>';});h+='</tbody></table></div>';return h;}
function renderMiniSummary(sid,shifts,y,m){const ss=staffByStore(sid);const days=dim(y,m);const r=S.storeRules[sid]||{};const minOff=calcMinOff(sid,y,m);let h='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:10px">';ss.forEach(st=>{let off=0,sat=0;for(let d=1;d<=days;d++){const s=(shifts[y+'-'+m+'-'+d]||{})[st.id];if(s==='off'){off++;if(new Date(y,m-1,d).getDay()===6)sat++;}}const pct=Math.min(100,Math.round(off/(r.maxMonthlyOff||8)*100));const under=off<minOff&&off>0;h+='<div style="background:#fff;border:1px solid '+(under?'#e8c87a':'var(--border)')+';border-radius:var(--r);padding:8px 10px"><div style="font-size:11px;font-weight:500;color:var(--ink)">'+st.name.split(' ')[0]+'</div><div style="font-size:10px;color:'+(under?'#8a5a00':'var(--ink4)')+'">'+( under?'⚠ 休'+off+'日（最低'+minOff+'日）':'休 '+off+'日 ／ 土 '+sat+'回')+'</div><div class="progress-bar"><div class="progress-fill'+(pct>=100?' over':'')+'" style="width:'+pct+'%"></div></div></div>';});h+='</div>';return h;}
function renderStore(){const c=document.getElementById('content');const store=storeById(S.activeStore);let h='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="store-accent" style="background:'+store.color+';height:20px"></div><span style="font-family:var(--ff-serif);font-size:20px;color:var(--ink)">'+store.name+'</span><button class="btn sm" onclick="openRenameStore(\''+store.id+'\')"><i class="ti ti-edit"></i></button><button class="btn sm danger" style="margin-left:auto" onclick="deleteStore(\''+store.id+'\')"><i class="ti ti-trash"></i>店舗削除</button></div><div class="tab-inner">';[{t:'shift',icon:'ti-calendar',label:'シフト'},{t:'request',icon:'ti-pencil',label:'シフト希望'},{t:'staff',icon:'ti-users',label:'スタッフ'},{t:'rules',icon:'ti-settings',label:'ルール設定'},{t:'history',icon:'ti-history',label:'履歴'}].forEach(t=>{h+='<button class="tab-inner-btn'+(S.activeStoreTab===t.t?' active':'')+'" onclick="setStoreTab(\''+t.t+'\')"><i class="ti '+t.icon+'"></i> '+t.label+'</button>';});h+='</div>';if(S.activeStoreTab==='shift')h+=renderStoreShift();else if(S.activeStoreTab==='request')h+=renderRequestCal();else if(S.activeStoreTab==='staff')h+=renderStoreStaff();else if(S.activeStoreTab==='rules')h+=renderStoreRules();else if(S.activeStoreTab==='history')h+=renderHistoryPanel();c.innerHTML=h;}
function renderStoreShift(){const y=S.currentYear,m=S.currentMonth,sid=S.activeStore;const shifts=gShifts();const reqs=gReqs();const ss=staffByStore(sid);const days=dim(y,m);const first=fdow(y,m);const warns=validateStore(sid,shifts,y,m);let h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div style="display:flex;align-items:center;gap:8px"><button class="btn sm" onclick="prevMonth()"><i class="ti ti-chevron-left"></i></button><span style="font-family:var(--ff-serif);font-size:18px;">'+y+'年 '+MONTHS[m-1]+'</span><button class="btn sm" onclick="nextMonth()"><i class="ti ti-chevron-right"></i></button></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn sm ghost-gold" onclick="autoGenerateStore(\''+sid+'\')"><i class="ti ti-wand"></i>自動振り分け</button><button class="btn sm gold" onclick="saveHistory()"><i class="ti ti-device-floppy"></i>保存</button></div></div>';warns.forEach(w=>h+='<div class="alert warn"><i class="ti ti-alert-triangle"></i>'+w+'</div>');if(!warns.length&&Object.keys(shifts).length>0)h+='<div class="alert ok"><i class="ti ti-circle-check"></i>シフトに問題はありません</div>';h+='<div class="legend" style="margin-bottom:8px"><div class="legend-item"><div class="legend-dot" style="background:var(--gold-pale);border:1px solid #c8a84a"></div><span style="color:var(--gold)">休み</span></div><div class="legend-item"><div class="legend-dot" style="background:var(--lesson-bg);border:1px solid #a8d4f0"></div><span style="color:var(--lesson-color)">社内レッスン</span></div><div class="legend-item"><div class="legend-dot" style="background:var(--other-bg);border:1px solid #a8d4a0"></div><span style="color:var(--other-color)">他店舗出勤</span></div></div>';h+='<div class="cal-days-header">';DAYS.forEach((d,i)=>h+='<div class="cal-head'+(i===0?' sun':i===6?' sat':'')+'">'+d+'</div>');h+='</div><div class="cal-grid">';for(let i=0;i<first;i++)h+='<div class="cal-cell empty"></div>';for(let d=1;d<=days;d++){const key=y+'-'+m+'-'+d;const dType=dayType(y,m,d);const dt=new Date(y,m-1,d);const dow=dt.getDay();let cls='cal-cell';if(dType==='sat')cls+=' sat-cell';else if(dType==='sun'||dType==='hol')cls+=' sun-cell';let dcls='cal-date';if(dow===0||dType==='hol')dcls+=' hol';else if(dow===6)dcls+=' sat';let chips='';ss.forEach(st=>{const s=(shifts[key]||{})[st.id];const rv=(reqs[key]||{})[st.id];const ln=(st.name.split(' ')[1]||st.name).slice(0,3);if(s==='off')chips+='<div class="off-chip" style="background:'+st.color+'14;color:'+st.color+';border:1px solid '+st.color+'30">'+ln+' 休</div>';else if(rv==='lesson')chips+='<div class="off-chip" style="background:var(--lesson-bg);color:var(--lesson-color);border:1px solid #a8d4f0">'+ln+' 研</div>';else if(rv==='other_store')chips+='<div class="off-chip" style="background:var(--other-bg);color:var(--other-color);border:1px solid #a8d4a0">'+ln+' 他</div>';});h+='<div class="'+cls+'" onclick="openDayModal(\''+key+'\')"><div class="'+dcls+'">'+d+(dType==='hol'?'<span style="font-size:8px;color:var(--sun-text);margin-left:1px">祝</span>':'')+'</div>'+chips+'</div>';}h+='</div><div class="divider"></div>'+renderSummaryTable(sid,shifts,y,m);return h;}

function pickStaffColor(c){document.querySelectorAll('#cp-staff .color-swatch').forEach(el=>el.classList.toggle('selected',el.style.background===c));const p=document.getElementById('cp-preview');if(p)p.style.background=c;const h=document.getElementById('cp-hex');if(h)h.textContent=c;window._pickedStaffColor=c;}
function pickStoreColor(c){document.querySelectorAll('#cp-store .color-swatch').forEach(el=>el.classList.toggle('selected',el.style.background===c));const p=document.getElementById('cp-preview');if(p)p.style.background=c;const h=document.getElementById('cp-hex');if(h)h.textContent=c;window._pickedStoreColor=c;}
function openAddStaffModal(){const dc=PALETTE[Math.floor(Math.random()*PALETTE.length)];window._pickedStaffColor=dc;showModal('スタッフを追加','<div class="form-row"><label>氏名</label><input type="text" id="m-name" placeholder="田中 花子"></div><div class="form-row"><label>役職</label><select id="m-role"><option>スタイリスト</option><option>アシスタント</option><option>店長</option></select></div><div class="form-row"><label>カラー</label><div id="cp-staff">'+colorPickerHtml(dc,'pickStaffColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="addStaff()">追加する</button></div>',{width:'380px'});}
function addStaff(){const name=document.getElementById('m-name').value.trim();if(!name)return;S.staff.push({id:S.nextId++,name,role:document.getElementById('m-role').value,color:window._pickedStaffColor||PALETTE[0],store:S.activeStore});save();closeModal();render();notify(name+'を追加しました');}
function openEditStaff(id){const st=S.staff.find(s=>s.id===id);if(!st)return;window._pickedStaffColor=st.color;const opts=S.stores.map(s=>'<option value="'+s.id+'"'+(s.id===st.store?' selected':'')+'>'+s.name+'</option>').join('');showModal('スタッフを編集','<div class="form-row"><label>氏名</label><input type="text" id="m-name" value="'+st.name+'"></div><div class="form-row"><label>役職</label><select id="m-role"><option'+(st.role==='スタイリスト'?' selected':'')+'>スタイリスト</option><option'+(st.role==='アシスタント'?' selected':'')+'>アシスタント</option><option'+(st.role==='店長'?' selected':'')+'>店長</option></select></div><div class="form-row"><label>担当店舗</label><select id="m-store">'+opts+'</select></div><div class="form-row"><label>カラー</label><div id="cp-staff">'+colorPickerHtml(st.color,'pickStaffColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="editStaff('+id+')">保存する</button></div>',{width:'380px'});}
function editStaff(id){const st=S.staff.find(s=>s.id===id);if(!st)return;st.name=document.getElementById('m-name').value.trim()||st.name;st.role=document.getElementById('m-role').value;st.store=document.getElementById('m-store').value;st.color=window._pickedStaffColor||st.color;save();closeModal();render();notify('更新しました');}
function removeStaff(id){const st=S.staff.find(s=>s.id===id);if(!confirm(st.name+'を削除しますか？'))return;S.staff=S.staff.filter(s=>s.id!==id);save();render();}
function openAddStoreModal(){const dc=PALETTE[Math.floor(Math.random()*PALETTE.length)];window._pickedStoreColor=dc;showModal('店舗を追加','<div class="form-row"><label>店舗名</label><input type="text" id="m-sn" placeholder="D店 表参道"></div><div class="form-row"><label>カラー</label><div id="cp-store">'+colorPickerHtml(dc,'pickStoreColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="addStore()">追加する</button></div>',{width:'380px'});}
function addStore(){const name=document.getElementById('m-sn').value.trim();if(!name)return;S.stores.push({id:name,name,color:window._pickedStoreColor||PALETTE[0]});S.storeRules[name]={satMaxOff:3,sunHolMaxOff:1,minStaff:1,maxConsec:5,maxMonthlyOff:8,minOffMode:'weekly2',minOffDays:8,requireStylist:true,sunHolDefaultWork:true};save();closeModal();render();notify(name+'を追加しました');}
function openRenameStore(id){const store=storeById(id);window._pickedStoreColor=store.color;showModal('店舗を編集','<div class="form-row"><label>店舗名</label><input type="text" id="m-sn" value="'+store.name+'"></div><div class="form-row"><label>カラー</label><div id="cp-store">'+colorPickerHtml(store.color,'pickStoreColor')+'</div></div><div style="display:flex;gap:7px;justify-content:flex-end;margin-top:14px"><button class="btn sm" onclick="closeModal()">キャンセル</button><button class="btn gold sm" onclick="renameStore(\''+id+'\')">保存する</button></div>',{width:'380px'});}
function renameStore(id){const store=storeById(id);store.name=document.getElementById('m-sn').value.trim()||store.name;store.color=window._pickedStoreColor||store.color;save();closeModal();render();notify('更新しました');}
function deleteStore(id){if(S.stores.length<=1){alert('最低1店舗が必要です');return;}if(!confirm(storeById(id).name+'を削除しますか？'))return;S.stores=S.stores.filter(s=>s.id!==id);S.staff=S.staff.filter(s=>s.store!==id);delete S.storeRules[id];S.activeStore=S.stores[0].id;S.mode='hq';save();render();}
function saveHistory(){const note=prompt('メモを入力（任意）','');if(note===null)return;const now=new Date();S.history.push({year:S.currentYear,month:S.currentMonth,savedAt:now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),note:note||'',shifts:JSON.parse(JSON.stringify(gShifts())),requests:JSON.parse(JSON.stringify(gReqs())),id:S.nextId++});save();notify('シフトを保存しました');render();}
function loadHistory(idx){const h=S.history[idx];S.currentYear=h.year;S.currentMonth=h.month;S.shifts[h.year+'-'+h.month]=JSON.parse(JSON.stringify(h.shifts));save();notify(h.year+'年'+MONTHS[h.month-1]+'のシフトを読み込みました');render();}
function deleteHistory(idx){if(!confirm('削除しますか？'))return;S.history.splice(idx,1);save();render();}
function showModal(title,body,opts){opts=opts||{};const el=document.createElement('div');el.id='modal-layer';el.style.cssText='position:fixed;inset:0;background:rgba(26,24,20,0.4);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:36px;overflow-y:auto';el.innerHTML='<div style="background:var(--surface);border-radius:var(--r-lg);padding:20px;width:'+(opts.width||'340px')+';margin:0 16px;border:1px solid var(--border2)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-family:var(--ff-serif);font-size:17px;color:var(--ink)">'+title+'</span><button class="btn sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div>'+body+'</div>';el.addEventListener('click',e=>{if(e.target===el)closeModal();});document.body.appendChild(el);}
function closeModal(){const el=document.getElementById('modal-layer');if(el)el.remove();}
</script>
</body>
</html>
